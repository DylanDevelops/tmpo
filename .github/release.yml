changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]
  categories:
    - title: ✨ Features
      labels:
        - "type: feature"
    - title: 🐛 Bug Fixes
      labels:
        - "type: fix"
    - title: 🚀 Performance Improvements
      labels:
        - "type: performance"
    - title: 🛠️ Refactoring
      labels:
        - "type: refactor"
    - title: 📚 Documentation
      labels:
        - "type: docs"
    - title: 🔧 Build & Dependencies
      labels:
        - "type: build"
        - "type: dependencies"
    - title: 🧹 Maintenance
      labels:
        - "type: chore"
    - title: Other Changes
      labels:
        - "*"
